name: Feature request
description: An idea for this library or plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case and why it is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help
      description: The API, setting or behavior you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you have tried
